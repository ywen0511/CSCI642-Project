# Supplementary baseline (EEGNeX, braindecode 1.8.1). Reported separately from the main comparison.
# One run, seed 42, default hyperparameters from the braindecode implementation / original paper.
seed: 42
input:
  view: eeg256
  scaling: train_global_std

model:
  name: bd_eegnex
  bd_class: EEGNeX
  sfreq: 256
  kwargs: {}
train:
  optimizer: adam
  lr: 0.001
  max_epochs: 150
  patience: 20
  scheduler: none
  weight_decay: 0.0
  batch_size: 64
  min_delta: 0.0
  monitor: auroc
  class_weighting: inverse_frequency
  label_smoothing: 0.0
  grad_clip: null
  deterministic: true
  periodic_ckpt_every: 25
  periodic_ckpt_keep: 4
