# Supplementary baseline (Labram, braindecode 1.8.1, weights braindecode/labram-pretrained). Reported separately from the main comparison.
# One run, seed 42, default hyperparameters from the braindecode implementation / original paper.
seed: 42
input:
  view: flat200
  scaling: fixed_divide
  scaling_params: {divisor: 100.0}   # LaBraM convention: 0.1 mV units
model:
  name: bd_labram
  bd_class: Labram
  sfreq: 200
  needs_chs_info: true
  forward_ch_names: true          # LaBraM selects channel position embeddings by name
  hf_repo: braindecode/labram-pretrained
  hf_revision: 0563b6c626e7b40d9a36653b763715db94d945d7
  head_prefix: [final_layer]
  kwargs: {}
train:
  optimizer: adamw
  backbone_lr: 0.0001
  lr: 0.0005
  max_epochs: 50
  patience: 15
  scheduler: cosine
  eta_min: 1.0e-6
  weight_decay: 0.05
  batch_size: 64
  min_delta: 0.0
  monitor: auroc
  class_weighting: inverse_frequency
  label_smoothing: 0.0
  grad_clip: 1.0
  deterministic: true
  periodic_ckpt_every: 5
  periodic_ckpt_keep: 4
